<style>
  :root {
    --black: #030303;
    --white: #f0f0f0;
    --green: #39ff6a;
    --blue: #00cfff;
    --grid: rgba(57, 255, 106, 0.04);
    --scan: rgba(57, 255, 106, 0.03);
    --blink-speed: 1.1s;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Share Tech Mono', monospace;
    overflow-x: hidden;
    cursor: crosshair;
    min-height: 100vh;
  }

  @keyframes syncBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .sync-blink { animation: syncBlink var(--blink-speed) step-end infinite !important; }
  .js-blink-target { opacity: 1; }

  body::before {
    content: ''; position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--scan) 2px, var(--scan) 4px);
    pointer-events: none; z-index: 9999;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }

  header { position: relative; z-index: 10; padding: 60px 60px 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .header-socials { position: absolute; top: 60px; right: 60px; display: flex; gap: 16px; align-items: center; }
  .header-socials a { color: #8c8c8c; transition: color 0.2s; }
  .header-socials a:hover { color: var(--green); }
  @media (max-width: 800px) { .header-socials { top: 20px; right: 20px; } }
  .logo { font-family: 'EMYRLA', monospace; font-weight: 400; font-size: clamp(3rem, 8vw, 5.5rem); color: var(--white); letter-spacing: -0.02em; line-height: 1; text-decoration: none; position: relative; }
  .logo .slash { color: var(--green); text-shadow: 0 0 20px var(--green), 0 0 60px var(--green); }
  .logo::after { content: attr(data-text); position: absolute; left: 3px; top: 3px; color: var(--blue); opacity: 0.18; z-index: -1; }
  @keyframes glitch { 0% { clip-path: inset(20% 0 60% 0); transform: translate(-3px); } 20% { clip-path: inset(70% 0 5% 0); transform: translate(3px); } 40% { clip-path: inset(40% 0 40% 0); transform: translate(-2px); } 60% { clip-path: inset(5% 0 80% 0); transform: translate(2px); } 80% { clip-path: inset(60% 0 20% 0); transform: translate(-1px); } 100% { clip-path: inset(0); transform: translate(0); } }
  .logo:hover::after { animation: glitch 0.3s steps(1) infinite; opacity: 0.4; color: var(--blue); }
  .logo.glitch-active::after { animation: glitch 0.25s steps(1) infinite; opacity: 0.45; color: var(--blue); }
  .logo-sub { font-family: 'Share Tech Mono', monospace; font-size: clamp(0.9rem, 1.9vw, 1.3rem); color: var(--green); letter-spacing: 0.3em; margin-top: 8px; opacity: 0.8; }
  
  nav { position: relative; z-index: 10; padding: 30px 60px; display: flex; justify-content: center; gap: 40px; border-bottom: 1px solid rgba(57, 255, 106, 0.25); }
  nav a { font-size: 0.75rem; color: #a0a0a0; text-decoration: none; letter-spacing: 0.2em; text-transform: uppercase; opacity: 1; }
  nav a.active { opacity: 1; color: var(--green); text-shadow: 0 0 10px var(--green); }

  /* Contact Terminal */
  .contact-container {
    position: relative; z-index: 10;
    max-width: 1800px; margin: 60px auto;
    padding: 0 40px;
    display: grid; grid-template-columns: 2fr 1fr; gap: 80px;
  }

  .terminal-box {
    border: 1px solid rgba(57, 255, 106, 0.25);
    background: rgba(0,0,0,0.6);
    padding: 30px;
    position: relative;
    overflow: hidden;
  }
  .terminal-box::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: var(--green);
    opacity: 0.1;
    animation: scan-line 4s linear infinite;
  }
  @keyframes scan-line {
    0% { top: 0; }
    100% { top: 100%; }
  }
  .terminal-header {
    font-size: 0.65rem; color: #8c8c8c;
    letter-spacing: 0.2em; border-bottom: 1px solid rgba(57,255,106,0.25);
    padding-bottom: 15px; margin-bottom: 25px;
  }

  .form-group { margin-bottom: 30px; position: relative; }
  .label {
    display: block; font-size: 0.7rem; color: var(--green);
    letter-spacing: 0.2em; margin-bottom: 10px; text-transform: uppercase;
  }
  input, textarea {
    width: 100%; background: transparent; border: none;
    color: var(--white); font-family: 'Share Tech Mono', monospace;
    font-size: 1rem; outline: none; padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  textarea { resize: none; overflow: hidden; line-height: 1.6; }
  input:focus, textarea:focus { border-bottom-color: var(--green); }

  .send-btn {
    background: transparent; border: 1px solid var(--green);
    color: var(--green); padding: 15px 30px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem; letter-spacing: 0.3em;
    cursor: pointer; transition: 0.3s;
    width: 100%; margin-top: 20px;
  }
  .send-btn:hover { background: var(--green); color: var(--black); box-shadow: 0 0 20px var(--green); }
  .send-btn.disabled { opacity: 0.3; pointer-events: none; }

  /* Right Side: Log Console */
  .console-log {
    font-size: 0.8rem; color: #2ecc57;
    line-height: 1.8;
  }
  .log-line { margin-bottom: 8px; display: flex; align-items: flex-start; }
  .prompt { color: var(--blue); margin-right: 10px; flex-shrink: 0; }
  .cursor-white { width: 8px; height: 1em; background: #fff; display: inline-block; margin-left: 5px; vertical-align: middle; }

  @media (max-width: 800px) {
    .contact-container { grid-template-columns: 1fr; }
    header, nav, footer { padding-left: 20px; padding-right: 20px; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo, .logo-sub, nav, .contact-container {
    animation: fadeUp 0.7s ease both;
  }
  nav                { animation-delay: 0.1s; }
  .contact-container { animation-delay: 0.2s; }

  footer { position: relative; z-index: 10; border-top: 1px solid rgba(57,255,106,0.25); padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; }
  .footer-logo { font-family: 'EMYRLA', monospace; font-weight: 400; font-size: 1rem; }

  .footer-info { font-size: 0.65rem; color: #8c8c8c; letter-spacing: 0.15em; text-align: right; line-height: 1.8; }
  .footer-info a { color: #2ecc57; text-decoration: none; }
</style>

<script>
const logContainer = document.getElementById('logContainer');

// Glitch spontané du logo — identique à index et manifesto
(function() {
  var logo = document.querySelector('.logo');
  function triggerGlitch() {
    logo.classList.add('glitch-active');
    setTimeout(function() { logo.classList.remove('glitch-active'); }, 500);
  }
  triggerGlitch();
  setInterval(triggerGlitch, 5000);
})();

// Ticker unique — source de vérité pour TOUS les clignotements
const blinkTargets = new Set();
blinkTargets.add(document.getElementById('headerCursor'));
let blinkState = true;
setInterval(() => {
  blinkState = !blinkState;
  blinkTargets.forEach(el => { el.style.opacity = blinkState ? '1' : '0'; });
}, 550); // 550ms × 2 = 1100ms = --blink-speed

// Auto-resize textarea
const msgArea = document.getElementById('message');
msgArea.addEventListener('input', () => {
  msgArea.style.height = 'auto';
  msgArea.style.height = msgArea.scrollHeight + 'px';
});

async function typeLog(text, duration = 1000, blink = false, color = null) {
  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = `<span class="prompt">&gt;</span> `;
  const textSpan = document.createElement('span');
  if (color) textSpan.style.color = color;
  line.appendChild(textSpan);
  logContainer.appendChild(line);

  const whiteCursor = document.createElement('div');
  whiteCursor.className = 'cursor-white sync-blink';
  line.appendChild(whiteCursor);

  const charDelay = 1000 / 64; 

  for (let i = 0; i < text.length; i++) {
    textSpan.textContent += text[i];
    await new Promise(r => setTimeout(r, charDelay));
  }

  await new Promise(r => setTimeout(r, duration));
  whiteCursor.remove();

  // Ajouter sync-blink APRÈS la fin du typage et du délai,
  // au même instant que le curseur repart — le navigateur
  // aligne automatiquement toutes les animations step-end en cours.
  if (blink) blinkTargets.add(textSpan);
}

document.getElementById('sendBtn').onclick = async function() {
  const btn = this;
  if(btn.classList.contains('disabled')) return;
  
  btn.classList.add('disabled');
  document.querySelectorAll('input, textarea').forEach(el => el.readOnly = true);

  logContainer.innerHTML = '';

  const sequence = [
    ["INITIALIZING TRANSMISSION...", 1000, false],
    ["ENCRYPTING PACKETS...", 800, false],
    ["ROUTING THROUGH SILICA// NODES...", 1500, false],
    ["SIGNAL STRENGTH: 98%", 500, false],
    ["TRANSMISSION SUCCESSFUL.", 2000, true, 'var(--white)'],
    ["GHOST_ WILL GIVE YOU A RESPONSE.", 0, false, 'var(--white)']
  ];

  for (const item of sequence) {
    await typeLog(item[0], item[1], item[2], item[3]);
  }
}
</script>
